name: Build RUN Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Verify Capacitor web shell
        run: test -f dist/client/index.html

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RUN-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload android-latest android/app/build/outputs/apk/debug/app-debug.apk --clobber -R "${{ github.repository }}"
          else
            gh release create android-latest android/app/build/outputs/apk/debug/app-debug.apk               --title "RUN Android APK"               --notes "RUN Android APK generated automatically from main."               --latest               -R "${{ github.repository }}"
          fi
