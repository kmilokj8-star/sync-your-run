name: Build RUN Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Verify Capacitor web shell
        run: test -f .output/public/index.html

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        working-directory: android
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RUN-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest -R "${{ github.repository }}" >/dev/null 2>&1 ||             gh release create android-latest --title "RUN Android APK" --notes "RUN Android APK generated automatically from main." --latest -R "${{ github.repository }}"
          gh release upload android-latest android/app/build/outputs/apk/release/app-release.apk --clobber -R "${{ github.repository }}"
